<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 저녁 밥상</title>
<meta name="theme-color" content="#2E6A4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="저녁 밥상">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Jua&display=swap">
<style>
/* Layout: one narrow column like a fridge-door meal card — "tomorrow" on top, the week as a ledger, shopping as a checklist tab */
:root {
  --bg: #F3F5F1;
  --surface: #FFFFFF;
  --ink: #1C2420;
  --muted: #5E6B63;
  --line: #DCE2DC;
  --leaf: #2E6A4C;
  --leaf-soft: #E3EFE7;
  --doenjang: #9A6418;
  --doenjang-soft: #F6ECDB;
  --done: #A3AEA7;
  --font-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1A211D; --ink: #E5EAE6; --muted: #9AA79F; --line: #2C3630;
    --leaf: #78C29B; --leaf-soft: #1F3328; --doenjang: #E2AC58; --doenjang-soft: #33291A; --done: #5C6861;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1A211D; --ink: #E5EAE6; --muted: #9AA79F; --line: #2C3630;
  --leaf: #78C29B; --leaf-soft: #1F3328; --doenjang: #E2AC58; --doenjang-soft: #33291A; --done: #5C6861;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }

nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
  background: var(--line); border-radius: 12px;
}
nav.tabs a {
  text-align: center; padding: 9px 8px; border-radius: 9px; text-decoration: none;
  color: var(--muted); font-weight: 600; font-size: 14px;
}
nav.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
nav.tabs a:focus-visible, button:focus-visible, .day:focus-visible, label.item:focus-within { outline: 2px solid var(--leaf); outline-offset: 2px; }

.weekbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.weekbar .range { font-weight: 600; font-variant-numeric: tabular-nums; }
.weekbar button {
  font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.weekbar button:disabled { opacity: .35; cursor: default; }

/* Recipe card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.when { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tag.leaf { background: var(--leaf-soft); color: var(--leaf); }
.tag.soy { background: var(--doenjang-soft); color: var(--doenjang); }
.dish h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.25; margin: 0; text-wrap: balance; }
.dish .side { color: var(--muted); font-size: 15px; margin-top: 2px; }
.note { border-left: 3px solid var(--doenjang); background: var(--doenjang-soft); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 14px; }
.note b { color: var(--doenjang); font-weight: 700; margin-right: 4px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 20px; }
@media (max-width: 560px) { .cols { grid-template-columns: minmax(0, 1fr); } }
h3 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.ing-group + .ing-group { margin-top: 12px; }
.ing-group .g { font-weight: 600; font-size: 13px; color: var(--leaf); margin-bottom: 4px; }
.ing { list-style: none; margin: 0; padding: 0; }
.ing li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.ing li span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; font-size: 14px; }
ol.steps li::before {
  content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--leaf); color: var(--surface);
  font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 1px;
}
.kids { font-size: 14px; color: var(--muted); }
.kids b { color: var(--ink); }

/* Week ledger */
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.day {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; background: none; width: 100%;
  font: inherit; color: inherit; text-align: left; border-left: 0; border-right: 0; border-bottom: 0;
}
.day:first-child { border-top: 0; }
.day:hover { background: var(--leaf-soft); }
.day[aria-pressed="true"] { background: var(--leaf-soft); }
.day .d { display: flex; flex-direction: column; line-height: 1.15; font-variant-numeric: tabular-nums; }
.day .d b { font-size: 16px; }
.day .d small { color: var(--muted); font-size: 12px; }
.day .m { min-width: 0; }
.day .m div { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .m small { color: var(--muted); font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day .badge { font-size: 11px; font-weight: 700; color: var(--leaf); }
.day.past { opacity: .55; }

/* Shopping */
.shophead { display: flex; flex-direction: column; gap: 10px; }
.progress { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--leaf); width: 0; transition: width .25s ease; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 16px 10px; }
.cat h3 { margin: 10px 0 2px; }
label.item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
label.item:first-of-type { border-top: 0; }
label.item input { width: 18px; height: 18px; accent-color: var(--leaf); margin: 0; }
label.item .nm { min-width: 0; }
label.item .nm small { display: block; color: var(--muted); font-size: 12px; }
label.item .q { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; text-align: right; }
label.item.on .nm, label.item.on .q { color: var(--done); text-decoration: line-through; }
.pantry { display: flex; flex-wrap: wrap; gap: 6px; }
.pantry span { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.empty { text-align: center; padding: 36px 20px; color: var(--muted); }
.empty h2 { font-family: var(--font-display); font-weight: 400; color: var(--ink); font-size: 22px; margin: 0 0 6px; }
.foot { font-size: 12px; color: var(--muted); }
textarea.copybox { width: 100%; min-height: 140px; font: inherit; font-size: 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px; }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">4인 · 한식 저녁 · 30분 이내</div>
    <h1>우리집 저녁 밥상</h1>
    <p class="sub" id="subline">메뉴를 불러오는 중이에요.</p>
  </header>

  <nav class="tabs" aria-label="보기 전환">
    <a href="#menu" id="tab-menu" aria-current="page">메뉴·레시피</a>
    <a href="#shop" id="tab-shop">장보기</a>
  </nav>

  <div class="weekbar" id="weekbar" hidden>
    <button type="button" id="prevWeek" aria-label="이전 주">‹ 이전 주</button>
    <span class="range" id="weekRange"></span>
    <button type="button" id="nextWeek" aria-label="다음 주">다음 주 ›</button>
  </div>

  <main id="view-menu">
    <div class="empty" id="menuEmpty">
      <h2>이번 주 밥상을 준비 중이에요</h2>
      <p>매주 토요일 오전에 다음 주 7일치 저녁 메뉴와 장보기 목록이 여기에 채워져요.</p>
    </div>
    <div id="menuBody" hidden style="display:flex;flex-direction:column;gap:20px">
      <article class="card" id="recipe" aria-live="polite"></article>
      <section>
        <h3>이번 주 메뉴</h3>
        <div class="ledger" id="ledger"></div>
      </section>
      <p class="foot" id="weekNote"></p>
    </div>
  </main>

  <main id="view-shop" hidden>
    <div class="empty" id="shopEmpty">
      <h2>장보기 목록이 아직 없어요</h2>
      <p>토요일 오전에 다음 주 메뉴와 함께 만들어져요.</p>
    </div>
    <div id="shopBody" hidden style="display:flex;flex-direction:column;gap:14px">
      <div class="shophead">
        <div class="count"><span id="shopWhen"></span><span id="shopCount"></span></div>
        <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      </div>
      <div id="cats" style="display:flex;flex-direction:column;gap:12px"></div>
      <section>
        <h3>집에 있는지 확인할 양념</h3>
        <div class="pantry" id="pantry"></div>
      </section>
      <div class="actions">
        <button type="button" class="btn primary" id="copyBtn">남은 목록 복사</button>
        <button type="button" class="btn" id="resetBtn">체크 모두 해제</button>
      </div>
      <textarea class="copybox" id="copyBox" hidden readonly aria-label="복사할 장보기 목록"></textarea>
      <div class="status" id="shopStatus"></div>
    </div>
  </main>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function seoulToday() {
    const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    return p; // YYYY-MM-DD
  }
  function addDays(iso, n) {
    const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  function md(iso) { const [, m, d] = iso.split("-"); return `${+m}/${+d}`; }
  function dowOf(iso) { return DOW[new Date(iso + "T00:00:00Z").getUTCDay()]; }

  const today = seoulToday();
  const tomorrow = addDays(today, 1);

  let weeks = [];          // sorted by start asc
  let weekIdx = -1;
  let selected = null;     // date string
  let checks = {};
  let readOnly = false;

  // ---- routing ----
  function route() {
    const shop = location.hash === "#shop";
    $("view-menu").hidden = shop; $("view-shop").hidden = !shop;
    $(shop ? "tab-menu" : "tab-shop").removeAttribute("aria-current");
    $(shop ? "tab-shop" : "tab-menu").setAttribute("aria-current", "page");
  }
  window.addEventListener("hashchange", route); route();

  function pickWeek() {
    if (!weeks.length) return -1;
    let i = weeks.findIndex((w) => w.start <= tomorrow && tomorrow <= w.end);
    if (i >= 0) return i;
    i = weeks.findIndex((w) => w.start > tomorrow);
    if (i >= 0) return i;
    return weeks.length - 1;
  }

  // ---- render menu ----
  function renderRecipe(w, day) {
    const isTomorrow = day.date === tomorrow, isToday = day.date === today;
    const label = isTomorrow ? "내일 저녁" : isToday ? "오늘 저녁" : `${md(day.date)} (${day.dow}) 저녁`;
    const ing = (day.ingredients || []).map((g) => `
      <div class="ing-group"><div class="g">${esc(g.group)}</div>
        <ul class="ing">${g.items.map((it) => `<li><span>${esc(it[0])}</span><span>${esc(it[1])}</span></li>`).join("")}</ul>
      </div>`).join("");
    const steps = (day.steps || []).map((s) => `<li><span>${esc(s)}</span></li>`).join("");
    $("recipe").innerHTML = `
      <div class="when"><span>${label}</span>
        <span class="tag leaf">${esc(day.minutes)}분</span>
        <span class="tag soy">1인 단백질 약 ${esc(day.protein)}g</span>
        <span class="tag leaf">${esc(w.servings || 4)}인분</span></div>
      <div class="dish"><h2>${esc(day.main)}</h2><div class="side">+ ${esc(day.side)}</div></div>
      ${day.prep ? `<div class="note"><b>전날 밤 준비</b>${esc(day.prep)}</div>` : ""}
      <div class="cols">
        <div><h3>재료</h3>${ing}</div>
        <div><h3>만드는 법</h3><ol class="steps">${steps}</ol></div>
      </div>
      ${day.kids ? `<div class="kids"><b>아이들 팁</b> · ${esc(day.kids)}</div>` : ""}`;
  }

  function renderLedger(w) {
    $("ledger").innerHTML = w.days.map((d) => {
      const badge = d.date === tomorrow ? "내일" : d.date === today ? "오늘" : "";
      const past = d.date < today ? " past" : "";
      return `<button type="button" class="day${past}" data-date="${esc(d.date)}" aria-pressed="${d.date === selected}">
        <span class="d"><b>${md(d.date)}</b><small>${esc(d.dow)}요일</small></span>
        <span class="m"><div>${esc(d.main)}</div><small>${esc(d.side)}</small></span>
        <span class="meta">${badge ? `<span class="badge">${badge}</span>` : ""}<span>${esc(d.minutes)}분 · ${esc(d.protein)}g</span></span>
      </button>`;
    }).join("");
  }

  $("ledger").addEventListener("click", (e) => {
    const b = e.target.closest(".day"); if (!b) return;
    selected = b.dataset.date; renderAll();
    $("recipe").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  });

  // ---- render shop ----
  function allItems(w) { return (w.shopping || []).flatMap((c) => c.items.map((it) => ({ ...it, cat: c.cat }))); }
  function renderShop(w) {
    const items = allItems(w);
    const done = items.filter((it) => checks[it.id]).length;
    $("shopWhen").textContent = `장보는 날 ${md(w.shopDay)} (${dowOf(w.shopDay)}) · ${md(w.start)}~${md(w.end)} 메뉴용`;
    $("shopCount").textContent = `${done} / ${items.length} 담음`;
    $("bar").style.width = items.length ? (done / items.length * 100) + "%" : "0";
    $("cats").innerHTML = (w.shopping || []).map((c) => `
      <section class="cat"><h3>${esc(c.cat)}</h3>
        ${c.items.map((it) => `<label class="item${checks[it.id] ? " on" : ""}" for="chk-${esc(it.id)}">
          <input type="checkbox" id="chk-${esc(it.id)}" data-id="${esc(it.id)}" ${checks[it.id] ? "checked" : ""} ${readOnly ? "disabled" : ""}>
          <span class="nm">${esc(it.name)}<small>${esc(it.for)}</small></span>
          <span class="q">${esc(it.qty)}</span></label>`).join("")}
      </section>`).join("");
    $("pantry").innerHTML = (w.pantry || []).map((p) => `<span>${esc(p)}</span>`).join("");
  }

  $("cats").addEventListener("change", (e) => {
    const box = e.target.closest("input[type=checkbox]"); if (!box) return;
    checks = { ...checks, [box.dataset.id]: box.checked };
    if (!checks[box.dataset.id]) delete checks[box.dataset.id];
    renderShop(weeks[weekIdx]);
    saveChecks();
  });
  $("resetBtn").addEventListener("click", () => { checks = {}; renderShop(weeks[weekIdx]); saveChecks(); });
  $("copyBtn").addEventListener("click", async () => {
    const w = weeks[weekIdx]; if (!w) return;
    const left = (w.shopping || []).map((c) => {
      const rest = c.items.filter((it) => !checks[it.id]);
      return rest.length ? `[${c.cat}]\n` + rest.map((it) => `- ${it.name} ${it.qty}`).join("\n") : "";
    }).filter(Boolean).join("\n\n");
    const text = `장보기 (${md(w.start)}~${md(w.end)} 저녁)\n\n` + (left || "모두 담았어요");
    try { await navigator.clipboard.writeText(text); $("shopStatus").textContent = "남은 목록을 복사했어요."; $("copyBox").hidden = true; }
    catch (_) { const t = $("copyBox"); t.value = text; t.hidden = false; t.focus(); t.select(); $("shopStatus").textContent = "복사가 막혀 있어요. 위 칸을 길게 눌러 복사하세요."; }
  });

  const KEY = (start) => "dinner-checks-" + start;
  function saveChecks() {
    const w = weeks[weekIdx]; if (!w) return;
    try { localStorage.setItem(KEY(w.start), JSON.stringify(checks)); $("shopStatus").textContent = "이 폰에 저장됨"; }
    catch (_) { $("shopStatus").textContent = "이 브라우저에서는 체크가 저장되지 않아요."; }
  }

  // ---- all ----
  function renderAll() {
    const w = weeks[weekIdx];
    const has = !!(w && w.days && w.days.length);
    $("menuEmpty").hidden = has; $("menuBody").hidden = !has;
    $("shopEmpty").hidden = has; $("shopBody").hidden = !has;
    $("weekbar").hidden = !has;
    if (!has) return;
    if (!selected || !w.days.some((d) => d.date === selected)) {
      const t = w.days.find((d) => d.date === tomorrow) || w.days.find((d) => d.date >= today) || w.days[0];
      selected = t.date;
    }
    const day = w.days.find((d) => d.date === selected);
    $("weekRange").textContent = `${md(w.start)} (${dowOf(w.start)}) ~ ${md(w.end)} (${dowOf(w.end)})`;
    $("prevWeek").disabled = weekIdx <= 0; $("nextWeek").disabled = weekIdx >= weeks.length - 1;
    const tDay = w.days.find((d) => d.date === tomorrow);
    $("subline").textContent = tDay ? `내일 저녁은 ${tDay.main} + ${tDay.side}` :
      (w.start > tomorrow ? `${md(w.shopDay)} (${dowOf(w.shopDay)}) 장보고 ${md(w.start)}부터 시작해요` : `${md(w.start)}~${md(w.end)} 주간 메뉴`);
    $("weekNote").textContent = w.note || "";
    renderRecipe(w, day); renderLedger(w); renderShop(w);
  }

  $("prevWeek").addEventListener("click", () => { if (weekIdx > 0) { weekIdx--; selected = null; watchChecks(); renderAll(); } });
  $("nextWeek").addEventListener("click", () => { if (weekIdx < weeks.length - 1) { weekIdx++; selected = null; watchChecks(); renderAll(); } });

  function watchChecks() {
    checks = {};
    const w = weeks[weekIdx]; if (!w) return;
    try { const raw = localStorage.getItem(KEY(w.start)); if (raw) checks = JSON.parse(raw) || {}; } catch (_) {}
  }

  // ---- boot ----
  (async () => {
    try {
      const res = await fetch("menu.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      weeks = (data.weeks || []).filter((w) => w && w.start).sort((a, b) => a.start.localeCompare(b.start));
    } catch (_) {
      $("subline").textContent = "메뉴를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.";
      return;
    }
    weekIdx = pickWeek();
    watchChecks();
    if (!weeks.length) $("subline").textContent = "아직 등록된 주간 메뉴가 없어요.";
    renderAll();
  })();
})();
</script>
</body>
</html>
